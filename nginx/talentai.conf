# ==============================================================================
# TalentAI — Production Nginx Reverse Proxy Configuration
# Unified HTTPS origin for React Single Page App & FastAPI backend
# ==============================================================================

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;
gzip_disable "MSIE [1-6]\.";

# 1. HTTP Server: Redirect all traffic to HTTPS (port 443)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge location for automated Let's Encrypt certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server: SSL Termination, Static Assets, and Internal Backend Routing
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificate & Private Key Paths
    ssl_certificate /etc/nginx/ssl/talentai.crt;
    ssl_certificate_key /etc/nginx/ssl/talentai.key;

    # Secure SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum client request body size (matching 100MB batch upload policy)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Connection and transfer timeouts
    client_body_timeout 120s;
    client_header_timeout 30s;
    send_timeout 120s;
    keepalive_timeout 65s;

    # Root directory for React production build assets
    root /usr/share/nginx/html;
    index index.html index.htm;

    # --------------------------------------------------------------------------
    # Static Assets Caching
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Backend API Routing (FastAPI Internal Service)
    # --------------------------------------------------------------------------
    location ~ ^/(auth|upload|batches|job-description|matching|ranking|status|results|demo|queue|health|docs|openapi.json)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Preserved headers for security, rate limiting, and session verification
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket and persistent connection support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy timeouts for long-running batch ranking operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Frontend Single Page Application Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom error pages (sanitized, non-revealing)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
